$kind: http-request
name: Update User Settings
method: PUT
url: '{{baseUrl}}/api/users/:userId/settings'
order: 3000
description: |-
  Update app settings for a user (language, notifications, biometric, speech).
  All body fields are optional; only provided fields are updated.
pathVariables:
  - key: userId
    value: '{{userId}}'
    description: The unique identifier of the user
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "language": "en",
      "notificationsEnabled": true,
      "biometricEnabled": false,
      "speechEnabled": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response contains userId", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("userId");
      });
