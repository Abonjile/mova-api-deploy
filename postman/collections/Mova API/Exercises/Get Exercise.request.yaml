$kind: http-request
name: Get Exercise
method: GET
url: '{{baseUrl}}/api/exercises/:id'
order: 2000
description: Retrieve a single exercise by its exerciseId. Returns 404 if not found.
pathVariables:
  - key: id
    value: '{{exerciseId}}'
    description: The unique identifier of the exercise
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response contains exerciseId", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("exerciseId");
      });
